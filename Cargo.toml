[workspace]
resolver = "2"
members = ["crates/zfs-core", "crates/zfs-toolbox", "crates/zfs-toolbox-helper"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Gilles Magneville"]
repository = "https://github.com/gillesmagneville/zfs-toolbox"
rust-version = "1.85"

[workspace.dependencies]
zfs-core = { path = "crates/zfs-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
