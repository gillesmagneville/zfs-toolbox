<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1c5aa6"/>
    </linearGradient>
    <linearGradient id="disk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#deddda"/>
      <stop offset="0.5" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c0bfbc"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bg)"/>
  <!-- Three stacked disks: a pool. -->
  <g stroke="#1a4a8a" stroke-width="2">
    <path d="M30 80 v12 c0 7 15 12 34 12 s34-5 34-12 v-12" fill="url(#disk)"/>
    <ellipse cx="64" cy="80" rx="34" ry="12" fill="#f6f5f4"/>
    <path d="M30 58 v12 c0 7 15 12 34 12 s34-5 34-12 v-12" fill="url(#disk)"/>
    <ellipse cx="64" cy="58" rx="34" ry="12" fill="#f6f5f4"/>
    <path d="M30 36 v12 c0 7 15 12 34 12 s34-5 34-12 v-12" fill="url(#disk)"/>
    <ellipse cx="64" cy="36" rx="34" ry="12" fill="#f6f5f4"/>
  </g>
  <!-- Activity lights. -->
  <circle cx="86" cy="51" r="3" fill="#33d17a"/>
  <circle cx="86" cy="73" r="3" fill="#33d17a"/>
  <circle cx="86" cy="95" r="3" fill="#33d17a"/>
</svg>
